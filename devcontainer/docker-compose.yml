# ─────────────────────────────────────────────────────────────────────
# Dev container — Tailscale sidecar + dev environment
# ─────────────────────────────────────────────────────────────────────
# Architecture:
#   tailscale sidecar ──shares network──> devbox container
#
# The sidecar joins your tailnet. The dev container shares its network
# namespace. Both sshd (port 22) and code-server (port 13337) are
# reachable via the Tailscale IP. No tailscale installed in the dev
# container.
#
# Multi-developer: each dev runs with a different project name:
#   docker compose -f devcontainer/docker-compose.yml \
#     --env-file .env.abhishek -p devbox-abhishek up -d
#
# Connect:
#   ssh coder@devbox-abhishek            (MagicDNS)
#   ssh coder@$(tailscale ip -4 devbox-abhishek)  (direct IP)
#   http://<ts-ip>:13337                  (code-server browser IDE)
# ─────────────────────────────────────────────────────────────────────

services:
  # ── Tailscale sidecar ──────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-${DEV_USER:-coder}
    hostname: devbox-${DEV_USER:-coder}

    environment:
      TS_AUTH_KEY: ${TS_AUTH_KEY:?Set TS_AUTH_KEY in your .env — create at login.tailscale.com/admin/settings/keys}
      TS_STATE_DIR: /var/lib/tailscale/state
      # Userspace=off means kernel TUN mode — better perf, needs /dev/net/tun
      TS_USERSPACE: "false"
      # Extra flags: no DNS (you have PiHole), accept routes for subnet forwarding
      TS_EXTRA_ARGS: --accept-dns=false --accept-routes
      # TS_SSH: true  # Uncomment for `tailscale ssh` — but then SSH
      #                 # targets the sidecar, not the dev container.
      #                 # Without it, use regular SSH over the tailnet.

    volumes:
      - tsstate:/var/lib/tailscale/state
      - /dev/net/tun:/dev/net/tun

    ports:
      - "41641:41641/udp"
    cap_add:
      - NET_ADMIN

    restart: unless-stopped

    healthcheck:
      # Check tailscale has a tailnet IP — `tailscale ip -4` fails
      # (non-zero) if not authenticated yet.  The tailscale/tailscale
      # image puts its socket at /tmp/tailscaled.sock, not /var/run/.
      test: ["CMD-SHELL", "tailscale ip -4 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Dev container ─────────────────────────────────────────────
  devbox:
    # Share the tailscale container's network namespace — the dev
    # container's sshd is reachable via the tailnet IP without
    # exposing any ports to the Docker bridge.
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy

    # Run as root so the entrypoint can manage users and start sshd
    # (it drops privileges via su for user-level setup)
    user: root

    build:
      context: .
      dockerfile: Dockerfile
    container_name: devbox-${DEV_USER:-coder}

    environment:
      DEV_USER: ${DEV_USER}
      DEV_PASSWORD: ${DEV_PASSWORD:-}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}

    # ── Resource limits (per-developer) ──────────────────────────
    deploy:
      resources:
        limits:
          cpus: "${DEV_CPUS:-4}"
          memory: "${DEV_MEMORY:-8G}"

    # ── Volumes ──────────────────────────────────────────────────
    volumes:
      # Docker socket (Docker-outside-of-Docker) — shared across all
      - /var/run/docker.sock:/var/run/docker.sock
      # Home directory — isolated per developer (project-prefixed volume)
      - devbox-home:/home/coder
      # Optional: bind-mount project repos
      # - /mnt/storage/projects:/home/coder/workspace

    # ── Health check ─────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

# ── Named volumes (prefixed by project name) ───────────────────────
volumes:
  tsstate:
  devbox-home:
